name: Declarative rollout using a local bytebase-action build

on:
  push:
    branches:
      - main
    paths:
      - "schema/*.sql"

# cancel previous workflow run if a new workflow run is triggered
# to prevent multiple rollout
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# The jobs run on a self-hosted runner that has a local Bytebase server and a
# local bytebase-action build on its PATH. The runner sets every GITHUB_*
# variable the action reads (event payload, commit, branch).
env:
  BYTEBASE_URL: http://localhost:8080
  BYTEBASE_WORKLOAD_IDENTITY: github-gitops-wi@gitops-state-based.workload.bytebase.com
  BYTEBASE_PROJECT: projects/gitops-state-based

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build app and upload
        run: |
          echo "Building..."
          echo "Build done!"
          echo "Uploading..."
          echo "Upload done!"
  create-rollout:
    needs: build
    permissions:
      id-token: write
    runs-on: self-hosted
    outputs:
      bytebase-plan: ${{ steps.set-output.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - name: Exchange token
        id: bytebase-auth
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bytebase" | jq -r '.value // empty' 2>/dev/null || true)
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Failed to get a GitHub OIDC token. Check that the job has the id-token: write permission."
            exit 1
          fi
          RESPONSE=$(curl -s -X POST "$BYTEBASE_URL/v1/auth:exchangeToken" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$OIDC_TOKEN\",\"email\":\"$BYTEBASE_WORKLOAD_IDENTITY\"}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken // empty' 2>/dev/null || true)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to exchange the OIDC token for a Bytebase access token: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access-token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
      - name: Create rollout
        env:
          BYTEBASE_ACCESS_TOKEN: ${{ steps.bytebase-auth.outputs.access-token }}
        run: |
          bytebase-action rollout \
            --url=$BYTEBASE_URL \
            --project=$BYTEBASE_PROJECT \
            --targets=projects/gitops-state-based/databaseGroups/bb-gitops-state-lezh \
            --file-pattern=schema/*.sql \
            --declarative \
            --output=${{ runner.temp }}/bytebase-metadata.json
      - name: Set output
        id: set-output
        run: |
          PLAN=$(jq -r .plan ${{ runner.temp }}/bytebase-metadata.json)
          echo "plan=$PLAN" >> $GITHUB_OUTPUT
  deploy-to-test:
    needs: create-rollout
    permissions:
      id-token: write
    runs-on: self-hosted
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Exchange token
        id: bytebase-auth
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bytebase" | jq -r '.value // empty' 2>/dev/null || true)
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Failed to get a GitHub OIDC token. Check that the job has the id-token: write permission."
            exit 1
          fi
          RESPONSE=$(curl -s -X POST "$BYTEBASE_URL/v1/auth:exchangeToken" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$OIDC_TOKEN\",\"email\":\"$BYTEBASE_WORKLOAD_IDENTITY\"}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken // empty' 2>/dev/null || true)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to exchange the OIDC token for a Bytebase access token: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access-token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
      - name: Deploy to test
        env:
          BYTEBASE_ACCESS_TOKEN: ${{ steps.bytebase-auth.outputs.access-token }}
        run: |
          bytebase-action rollout \
            --url=$BYTEBASE_URL \
            --project=$BYTEBASE_PROJECT \
            --target-stage=environments/test \
            --plan=${{ needs.create-rollout.outputs.bytebase-plan }}
  deploy-to-prod:
    needs:
      - deploy-to-test
      - create-rollout
    permissions:
      id-token: write
    runs-on: self-hosted
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Exchange token
        id: bytebase-auth
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bytebase" | jq -r '.value // empty' 2>/dev/null || true)
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::Failed to get a GitHub OIDC token. Check that the job has the id-token: write permission."
            exit 1
          fi
          RESPONSE=$(curl -s -X POST "$BYTEBASE_URL/v1/auth:exchangeToken" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$OIDC_TOKEN\",\"email\":\"$BYTEBASE_WORKLOAD_IDENTITY\"}")
          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.accessToken // empty' 2>/dev/null || true)
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::Failed to exchange the OIDC token for a Bytebase access token: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access-token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT
      - name: Deploy to prod
        env:
          BYTEBASE_ACCESS_TOKEN: ${{ steps.bytebase-auth.outputs.access-token }}
        run: |
          bytebase-action rollout \
            --url=$BYTEBASE_URL \
            --project=$BYTEBASE_PROJECT \
            --target-stage=environments/prod \
            --plan=${{ needs.create-rollout.outputs.bytebase-plan }}
